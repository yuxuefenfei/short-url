spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

mybatis-flex:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  application:
    name: short-url-test
  server:
    port: 8080
  short-url:
    domain: https://short.ly
    key-length: 6
    cache-expire-days: 7
  jwt:
    secret: testSecretKeyForTestingPurposesOnlyDoNotUseInProduction
    expiration: 86400000
  admin:
    online-user:
      ttl-seconds: 1800
  pagination:
    default-page: 1
    default-size: 20
    max-size: 200
  dashboard:
    default-trend-days: 7
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - HEAD
      allowed-headers:
        - "*"
      exposed-headers:
        - Authorization
        - X-Request-ID
        - X-Response-Time
      max-age: 3600

logging:
  level:
    com.example.shorturl: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
